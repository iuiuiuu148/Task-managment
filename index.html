<script>

const db = firebase.firestore();

const VAPID_KEY = "BK99rID_DLVs_6-yjJNeJ6g5giMuAMXoWOlAGYUaRivqeyHlXKBbPcA6OeDEKWEnShNSsn1aZfnJr-vh-k4-ptI";
let messaging = null;

// ---------- Constants ----------
const e = React.createElement;
const { useState, useEffect, useCallback, useRef } = React;

const C = {
  bg: "#12161D", surface: "#1A2029", surface2: "#212836",
  border: "#2C3444", borderLight: "#39435A", text: "#EDEFF3",
  muted: "#8B93A1", faint: "#5C6577", amber: "#E8A33D",
  amberDim: "#4A3A22", green: "#4FA97A", greenDim: "#1E3128",
  red: "#D9584C", redDim: "#3A2422",
};
const STATUS = { NEW: "Yeni", DOING: "Baxılır", PAUSED: "Fasilədə", DONE: "Həll edildi", FAILED: "Həll edilmədi" };
const PRIORITY = { NORMAL: "Adi", URGENT: "Təcili" };
const FONT = "IBM Plex Sans, sans-serif";
const DISPLAY_FONT = "Archivo, sans-serif";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function onEnter(fn) { return ev => { if (ev.key === "Enter") fn(); }; }
function defaultState() { return { members: [], tasks: [], rrIndex: 0, defaultMode: "strict", chat: [], departments: [] }; }
function activeMembers(members) { return members.filter(m => m.role === "member"); }
function openTaskCount(tasks, memberId) {
  return tasks.filter(t => t.assignedTo === memberId && t.status !== STATUS.DONE && t.status !== STATUS.FAILED).length;
}
function pickNext(members, tasks, rrIndex, mode) {
  const pool = activeMembers(members);
  if (pool.length === 0) return null;
  const startIdx = rrIndex % pool.length;
  if (mode === "skip") {
    for (let i = 0; i < pool.length; i++) {
      const idx = (startIdx + i) % pool.length;
      if (openTaskCount(tasks, pool[idx].id) === 0) return { member: pool[idx], idx };
    }
  }
  return { member: pool[startIdx], idx: startIdx };
}

// ---------- Small UI helpers ----------
function Avatar({ name, size = 36 }) {
  const initials = name.trim().split(/\s+/).map(p => p[0]).slice(0, 2).join("").toUpperCase();
  return e("div", {
    style: { width: size, height: size, borderRadius: 8, background: C.surface2,
      border: "1px solid " + C.borderLight, display: "flex", alignItems: "center",
      justifyContent: "center", fontFamily: DISPLAY_FONT, fontWeight: 700,
      fontSize: size * 0.38, color: C.text, flexShrink: 0 }
  }, initials);
}

function Badge({ children, tone }) {
  const tones = {
    amber: { bg: C.amberDim, fg: C.amber }, green: { bg: C.greenDim, fg: C.green },
    red: { bg: C.redDim, fg: C.red }, neutral: { bg: C.surface2, fg: C.muted },
  };
  const t = tones[tone] || tones.neutral;
  return e("span", { style: { background: t.bg, color: t.fg, fontSize: 12, fontWeight: 600,
    padding: "3px 9px", borderRadius: 6, fontFamily: FONT, whiteSpace: "nowrap" } }, children);
}

function Input({ label, value, onChange, placeholder, type, onKeyDown }) {
  return e("label", { style: { display: "flex", flexDirection: "column", gap: 6, fontFamily: FONT } },
    label && e("span", { style: { fontSize: 12.5, color: C.muted, fontWeight: 600 } }, label),
    e("input", {
      value, onChange, placeholder, type: type || "text", onKeyDown,
      style: { background: C.surface, border: "1px solid " + C.border, borderRadius: 8,
        padding: "9px 12px", color: C.text, fontSize: 14, fontFamily: FONT, outline: "none" }
    })
  );
}

function btnStyle(color, filled) {
  return { display: "flex", alignItems: "center", gap: 6, background: filled || "transparent",
    border: "1px solid " + color, color, fontFamily: FONT, fontWeight: 600, fontSize: 12.5,
    padding: "6px 11px", borderRadius: 7, cursor: "pointer" };
}
const iconBtn = { background: "transparent", border: "none", cursor: "pointer", padding: 4,
  display: "flex", alignItems: "center", fontSize: 15 };
const primaryBtn = { display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
  background: C.amber, border: "none", color: "#1A1204", fontFamily: FONT, fontWeight: 700,
  fontSize: 14, padding: "11px 16px", borderRadius: 9, cursor: "pointer" };

function RotationStrip({ members, tasks, rrIndex, currentUserId }) {
  const pool = activeMembers(members);
  if (pool.length === 0) {
    return e("div", { style: { color: C.faint, fontSize: 13, fontFamily: FONT } }, "Komandada hələ heç kim yoxdur.");
  }
  const nextIdx = rrIndex % pool.length;
  return e("div", { style: { display: "flex", alignItems: "center", overflowX: "auto", paddingBottom: 4 } },
    pool.map((m, i) => {
      const isNext = i === nextIdx;
      const open = openTaskCount(tasks, m.id);
      return e(React.Fragment, { key: m.id },
        e("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", gap: 6, minWidth: 76 } },
          e("div", { style: { padding: 3, borderRadius: 10, border: isNext ? "2px solid " + C.amber : "2px solid transparent" } },
            e(Avatar, { name: m.name, size: 40 })),
          e("div", { style: { fontSize: 12, color: isNext ? C.amber : C.muted, fontFamily: FONT,
            fontWeight: isNext ? 700 : 500, textAlign: "center", maxWidth: 76, overflow: "hidden",
            textOverflow: "ellipsis", whiteSpace: "nowrap" } }, m.name),
          e("div", { style: { fontSize: 11, color: open > 0 ? C.amber : C.faint, fontFamily: FONT } }, open + " açıq"),
          isNext && e("div", { style: { fontSize: 10, color: C.amber, fontFamily: FONT, fontWeight: 700 } }, "NÖVBƏTİ")
        ),
        i < pool.length - 1 && e("span", { style: { color: C.faint, margin: "0 6px", marginBottom: 22, flexShrink: 0 } }, "→")
      );
    })
  );
}

function formatDuration(ms) {
  const totalMin = Math.max(0, Math.round(ms / 60000));
  if (totalMin < 60) return totalMin + " dəq";
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h + " saat " + (m ? m + " dəq" : "");
}

function TaskCard({ task, members, currentUser, onStart, onPause, onResume, onResolve, onFail, onComment, onDelete, showAssignee }) {
  const [commentText, setCommentText] = useState("");
  const [showFailBox, setShowFailBox] = useState(false);
  const [failReasonText, setFailReasonText] = useState("");
  const assignee = members.find(m => m.id === task.assignedTo);
  const isPaused = task.status === STATUS.PAUSED;
  const isDoing = task.status === STATUS.DOING;
  const isNew = task.status === STATUS.NEW;
  const isDone = task.status === STATUS.DONE;
  const isFailed = task.status === STATUS.FAILED;
  const isTerminal = isDone || isFailed;

  const children = [
    e("div", { key: "top", style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 } },
      e("div", { style: { fontFamily: FONT, fontWeight: 600, fontSize: 14.5, color: C.text, lineHeight: 1.35 } }, task.title),
      e("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
        e(Badge, { tone: task.priority === PRIORITY.URGENT ? "red" : "neutral" }, task.priority),
        onDelete && e("button", {
          onClick: () => { if (window.confirm("Bu tapşırıq silinsin?")) onDelete(task.id); },
          style: { ...iconBtn, color: C.faint }
        }, "🗑")
      )
    ),
    task.desc && e("div", { key: "desc", style: { fontSize: 13, color: C.muted, fontFamily: FONT, lineHeight: 1.5 } }, task.desc),
    (task.requester || task.room || task.department) && e("div", { key: "info", style: { display: "flex", flexWrap: "wrap", gap: 6 } },
      task.department && e(Badge, { tone: "amber" }, "🏢 " + task.department),
      task.requester && e(Badge, { tone: "neutral" }, "👤 " + task.requester),
      task.room && e(Badge, { tone: "neutral" }, "🚪 Otaq " + task.room)
    ),
    e("div", { key: "times", style: { display: "flex", flexDirection: "column", gap: 2 } },
      task.createdBy && e("div", { style: { fontSize: 11.5, color: C.faint, fontFamily: FONT } },
        "Yaradıb: " + task.createdBy + (task.createdAt ? " · " + new Date(task.createdAt).toLocaleString("az-AZ") : "")),
      task.status === STATUS.DONE && task.resolvedBy && e("div", { style: { fontSize: 11.5, color: C.green, fontFamily: FONT } },
        "Həll edib: " + task.resolvedBy + (typeof task.durationMinutes === "number" ? " · " + formatDuration(task.durationMinutes * 60000) + " çəkib" : "")),
      isFailed && e("div", { style: { fontSize: 11.5, color: C.red, fontFamily: FONT } },
        "Həll edilmədi (" + (task.failedBy || "") + "): " + (task.failReason || "səbəb qeyd edilməyib"))
    ),
    e("div", { key: "meta", style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, marginTop: 2 } },
      e("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
        showAssignee !== false && assignee && e(React.Fragment, null,
          e(Avatar, { name: assignee.name, size: 22 }),
          e("span", { style: { fontSize: 12.5, color: C.muted, fontFamily: FONT } }, assignee.name)
        )
      ),
      e(Badge, { tone: isDone ? "green" : (isFailed ? "red" : (isDoing ? "amber" : (isPaused ? "red" : "neutral"))) }, task.status)
    )
  ];

  if (!isTerminal && (onStart || onPause || onResume || onResolve || onFail)) {
    children.push(e("div", { key: "actions", style: { display: "flex", gap: 8, marginTop: 2, flexWrap: "wrap" } },
      isNew && onStart && e("button", { onClick: () => onStart(task.id), style: btnStyle(C.amber) }, "▶ Başla"),
      isDoing && onPause && e("button", { onClick: () => onPause(task.id), style: btnStyle(C.muted) }, "⏸ Fasilə ver"),
      isDoing && onResolve && e("button", { onClick: () => onResolve(task.id), style: btnStyle(C.green) }, "✓ Həll et"),
      isPaused && onResume && e("button", { onClick: () => onResume(task.id), style: btnStyle(C.amber) }, "▶ Davam et"),
      (isDoing || isPaused) && onFail && e("button", { onClick: () => setShowFailBox(v => !v), style: btnStyle(C.red) }, "✗ Həll edilmədi")
    ));
  }

  if (showFailBox && onFail) {
    children.push(e("div", { key: "failbox", style: { display: "flex", flexDirection: "column", gap: 6, background: C.redDim, borderRadius: 8, padding: 10 } },
      e("div", { style: { fontFamily: FONT, fontSize: 12, color: C.red, fontWeight: 600 } }, "Niyə həll edilmədi?"),
      e("input", {
        value: failReasonText, onChange: ev => setFailReasonText(ev.target.value), placeholder: "Səbəbi yazın...",
        style: { background: C.surface, border: "1px solid " + C.border, borderRadius: 7, padding: "7px 10px", color: C.text, fontSize: 12.5, fontFamily: FONT, outline: "none" }
      }),
      e("div", { style: { display: "flex", gap: 8 } },
        e("button", {
          onClick: () => { if (failReasonText.trim()) { onFail(task.id, failReasonText.trim()); setShowFailBox(false); setFailReasonText(""); } },
          disabled: !failReasonText.trim(),
          style: { ...btnStyle(C.red), opacity: !failReasonText.trim() ? 0.5 : 1 }
        }, "Təsdiqlə"),
        e("button", { onClick: () => { setShowFailBox(false); setFailReasonText(""); }, style: btnStyle(C.muted) }, "İmtina")
      )
    ));
  }

  if (task.comments && task.comments.length > 0) {
    children.push(e("div", { key: "comments", style: { display: "flex", flexDirection: "column", gap: 6, background: C.surface, borderRadius: 8, padding: 10 } },
      task.comments.map((c, i) => e("div", { key: i, style: { fontSize: 12.5, fontFamily: FONT } },
        e("span", { style: { color: C.text, fontWeight: 600 } }, c.author + ": "),
        e("span", { style: { color: C.muted } }, c.text),
        e("span", { style: { color: C.faint, fontSize: 10.5, marginLeft: 6 } }, new Date(c.at).toLocaleString("az-AZ"))
      ))
    ));
  }

  if (onComment) {
    children.push(e("div", { key: "commentbox", style: { display: "flex", gap: 6 } },
      e("input", {
        value: commentText, onChange: ev => setCommentText(ev.target.value), placeholder: "Şərh yaz...",
        onKeyDown: ev => { if (ev.key === "Enter" && commentText.trim()) { onComment(task.id, commentText.trim()); setCommentText(""); } },
        style: { flex: 1, background: C.surface, border: "1px solid " + C.border, borderRadius: 7, padding: "7px 10px", color: C.text, fontSize: 12.5, fontFamily: FONT, outline: "none" }
      }),
      e("button", {
        onClick: () => { if (commentText.trim()) { onComment(task.id, commentText.trim()); setCommentText(""); } },
        style: btnStyle(C.muted)
      }, "Göndər")
    ));
  }

  return e("div", { style: { background: C.surface2, border: "1px solid " + C.border, borderRadius: 10,
    padding: 14, display: "flex", flexDirection: "column", gap: 10 } }, children);
}

// ---------- Main App ----------
function App() {
  const [state, setState] = useState(null);
  const [loading, setLoading] = useState(true);
  const [currentUser, setCurrentUser] = useState(null);
  const [loginPin, setLoginPin] = useState("");
  const [loginName, setLoginName] = useState("");
  const [loginError, setLoginError] = useState("");
  const [setupName, setSetupName] = useState("");
  const [setupPin, setSetupPin] = useState("");
  const [tab, setTab] = useState("new");
  const [newTitle, setNewTitle] = useState("");
  const [newDesc, setNewDesc] = useState("");
  const [newRequester, setNewRequester] = useState("");
  const [newRoom, setNewRoom] = useState("");
  const [newDepartment, setNewDepartment] = useState("");
  const [deptInput, setDeptInput] = useState("");
  const [reportStart, setReportStart] = useState(() => { const d = new Date(); d.setDate(1); return d.toISOString().slice(0, 10); });
  const [reportEnd, setReportEnd] = useState(() => new Date().toISOString().slice(0, 10));
  const [reportMemberFilter, setReportMemberFilter] = useState("all");
  const [newPriority, setNewPriority] = useState(PRIORITY.NORMAL);
  const [assignMode, setAssignMode] = useState("strict");
  const [manualPick, setManualPick] = useState(null);
  const [addMemberName, setAddMemberName] = useState("");
  const [addMemberPin, setAddMemberPin] = useState("");
  const [profileName, setProfileName] = useState("");
  const [profilePin, setProfilePin] = useState("");
  const [profileSaved, setProfileSaved] = useState(false);
  const [editingMemberId, setEditingMemberId] = useState(null);
  const [editMemberName, setEditMemberName] = useState("");
  const [editMemberPin, setEditMemberPin] = useState("");
  const [chatInput, setChatInput] = useState("");
  const [chatPartnerId, setChatPartnerId] = useState(null);
  const [notifPermission, setNotifPermission] = useState(
    (typeof Notification !== "undefined") ? Notification.permission : "unsupported"
  );
  const [pushDebug, setPushDebug] = useState("");
  const prevTaskIdsRef = useRef(null);

  useEffect(() => {
    const unsub = docRef.onSnapshot(snap => {
      if (snap.exists) {
        setState(snap.data());
      } else {
        const d = defaultState();
        docRef.set(d);
        setState(d);
      }
      setLoading(false);
    }, err => { console.error(err); setLoading(false); });
    return unsub;
  }, []);

  useEffect(() => {
    if (currentUser) { setProfileName(currentUser.name); setProfilePin(currentUser.pin); setProfileSaved(false); }
  }, [currentUser && currentUser.id]);

  useEffect(() => {
    if (currentUser && state) {
      const fresh = state.members.find(m => m.id === currentUser.id);
      if (fresh && (fresh.name !== currentUser.name || fresh.pin !== currentUser.pin)) setCurrentUser(fresh);
      if (!fresh) setCurrentUser(null);
    }
  }, [state]);

  useEffect(() => {
    if (!currentUser && state && state.members && state.members.length > 0) {
      try {
        const savedId = localStorage.getItem("tn_userId");
        if (savedId) {
          const m = state.members.find(x => x.id === savedId);
          if (m) setCurrentUser(m);
        }
      } catch (e) {}
    }
  }, [state]);

  useEffect(() => {
    if (!currentUser) { prevTaskIdsRef.current = null; return; }
  }, [currentUser && currentUser.id]);

  useEffect(() => {
    if (!state || !currentUser) return;
    const myTasksNow = state.tasks.filter(t => t.assignedTo === currentUser.id);
    const myIds = new Set(myTasksNow.map(t => t.id));
    if (prevTaskIdsRef.current === null) {
      prevTaskIdsRef.current = myIds;
      return;
    }
    myTasksNow.forEach(t => {
      if (!prevTaskIdsRef.current.has(t.id) && typeof Notification !== "undefined" && Notification.permission === "granted") {
        try {
          const n = new Notification("Yeni tapşırıq düşdü", { body: t.title, icon: "icon-192.png" });
          n.onclick = () => window.focus();
        } catch (err) {}
      }
    });
    prevTaskIdsRef.current = myIds;
  }, [state]);

  useEffect(() => {
    if (!currentUser || !state || tab !== "chat" || !chatPartnerId) return;
    const me = state.members.find(m => m.id === currentUser.id);
    const lastRead = (me && me.readReceipts && me.readReceipts[chatPartnerId]) || 0;
    const hasUnread = (state.chat || []).some(m => m.senderId === chatPartnerId && m.recipientId === currentUser.id && m.at > lastRead);
    if (hasUnread) markConversationRead(chatPartnerId);
  }, [state, tab, chatPartnerId]);

  const persist = useCallback((updater) => {
    setState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      docRef.set(next);
      return next;
    });
  }, []);

  if (loading || !state) {
    return e("div", { style: { ...wrapStyle, alignItems: "center", justifyContent: "center" } },
      e("div", { style: { color: C.muted, fontFamily: FONT } }, "Yüklənir…"));
  }

  // ---------- LOGIN / SETUP ----------
  if (!currentUser) {
    const hasAnyone = state.members.length > 0;

    if (!hasAnyone) {
      return e("div", { style: { ...wrapStyle, alignItems: "center", justifyContent: "center" } },
        e("div", { style: { width: 340, display: "flex", flexDirection: "column", gap: 18 } },
          e("div", null,
            e("div", { style: { fontFamily: DISPLAY_FONT, fontWeight: 800, fontSize: 22, color: C.text } }, "Tapşırıq Növbəsi"),
            e("div", { style: { fontFamily: FONT, fontSize: 13.5, color: C.muted, marginTop: 4 } },
              "İlk addım: admin hesabı yaradın. Komanda üzvlərini sonra əlavə edə bilərsiniz.")
          ),
          e(Input, { label: "Adınız", value: setupName, onChange: ev => setSetupName(ev.target.value), placeholder: "Məs: Aysel" }),
          e(Input, { label: "4 rəqəmli PIN", value: setupPin, onChange: ev => setSetupPin(ev.target.value.replace(/\D/g, "").slice(0, 6)), placeholder: "0000",
            onKeyDown: onEnter(() => {
              if (!setupName.trim() || setupPin.length < 4) return;
              const member = { id: uid(), name: setupName.trim(), pin: setupPin, role: "reception" };
              const next = { ...state, members: [...state.members, member] };
              persist(next); setCurrentUser(member);
              try { localStorage.setItem("tn_userId", member.id); } catch (e) {}
            }) }),
          e("button", {
            disabled: !setupName.trim() || setupPin.length < 4,
            onClick: () => {
              const member = { id: uid(), name: setupName.trim(), pin: setupPin, role: "reception" };
              const next = { ...state, members: [...state.members, member] };
              persist(next); setCurrentUser(member);
              try { localStorage.setItem("tn_userId", member.id); } catch (e) {}
            },
            style: { ...primaryBtn, opacity: (!setupName.trim() || setupPin.length < 4) ? 0.5 : 1 }
          }, "🛡 Admin hesabı yarat")
        )
      );
    }

    function attemptLogin() {
      const typed = loginName.trim().toLowerCase();
      const m = state.members.find(x => x.name.trim().toLowerCase() === typed);
      if (m && m.pin === loginPin) {
        setCurrentUser(m);
        try { localStorage.setItem("tn_userId", m.id); } catch (e) {}
        setLoginPin(""); setLoginName(""); setLoginError("");
      } else {
        setLoginError("Ad və ya PIN yanlışdır.");
      }
    }

    return e("div", { style: { ...wrapStyle, alignItems: "center", justifyContent: "center" } },
      e("div", { style: { width: 340, display: "flex", flexDirection: "column", gap: 18 } },
        e("div", null,
          e("div", { style: { fontFamily: DISPLAY_FONT, fontWeight: 800, fontSize: 22, color: C.text } }, "Tapşırıq Növbəsi"),

    }));

  function pauseTask(taskId) {

      tasks: prev.tasks.map(t => t.id === taskId ? { ...t, status: STATUS.PAUSED, pausedAt: Date.now() } : t)
    }));
  }

  function resumeTask(taskId) {
    persist(prev => ({
      ...prev,
      tasks: prev.tasks.map(t => {
        if (t.id !== taskId) return t;
        const extraPause = t.pausedAt ? (Date.now() - t.pausedAt) : 0;
        return { ...t, status: STATUS.DOING, totalPauseMs: (t.totalPauseMs || 0) + extraPause, pausedAt: null };
      })
    }));
  }

  function resolveTask(taskId) {
    persist(prev => ({
      ...prev,
      tasks: prev.tasks.map(t => {
        if (t.id !== taskId) return t;
        const now = Date.now();
        const started = t.startedAt || now;
        const pauseMs = (t.totalPauseMs || 0) + (t.pausedAt ? (now - t.pausedAt) : 0);
        const durationMinutes = Math.max(0, Math.round((now - started - pauseMs) / 60000));
        return { ...t, status: STATUS.DONE, resolvedBy: currentUser.name, resolvedAt: now, pausedAt: null, durationMinutes };
      })
    }));
  }

  function submitTask() {
    if (!newTitle.trim()) return;
    persist(prev => {
      let assignedTo = null, rrIndex = prev.rrIndex;
      const pool = activeMembers(prev.members);
      if (pool.length > 0) {
        if (assignMode === "manual") {
          const chosen = manualPick ? pool.find(p => p.id === manualPick) : null;
          if (chosen) {
            assignedTo = chosen.id;
            const idx = pool.findIndex(p => p.id === chosen.id);
            rrIndex = (idx + 1) % pool.length;
          }
        } else {
          const res = pickNext(prev.members, prev.tasks, prev.rrIndex, assignMode);
          if (res) { assignedTo = res.member.id; rrIndex = (res.idx + 1) % pool.length; }
        }
      }
      const task = { id: uid(), title: newTitle.trim(), desc: newDesc.trim(), priority: newPriority,
        requester: newRequester.trim(), room: newRoom.trim(), department: newDepartment || null,
        status: STATUS.NEW, assignedTo, createdBy: currentUser.name, createdAt: Date.now() };
      return { ...prev, tasks: [...prev.tasks, task], rrIndex };

      const reordered = [...pool];
      [reordered[idx], reordered[swapIdx]] = [reordered[swapIdx], reordered[idx]];
      const others = prev.members.filter(m => m.role !== "member");
      return { ...prev, members: [...others, ...reordered] };
    });
  }

      XLSX.utils.book_append_sheet(wb, ws2, "Xülasə");
      XLSX.utils.book_append_sheet(wb, ws1, "Tapşırıqlar");
      XLSX.writeFile(wb, "hesabat-" + reportStart + "_" + reportEnd + ".xlsx");
    }

    sections.push(e("div", { key: "reports", id: "print-area", style: { display: "flex", flexDirection: "column", gap: 20 } },
      e("div", { className: "no-print", style: { display: "flex", flexDirection: "column", gap: 10 } },
        e("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" } },
          e(Input, { label: "Başlanğıc tarix", type: "date", value: reportStart, onChange: ev => setReportStart(ev.target.value) }),
          e(Input, { label: "Son tarix", type: "date", value: reportEnd, onChange: ev => setReportEnd(ev.target.value) }),
          e("label", { style: { display: "flex", flexDirection: "column", gap: 6, fontFamily: FONT } },
            e("span", { style: { fontSize: 12.5, color: C.muted, fontWeight: 600 } }, "Komanda üzvü"),
            e("select", {
              value: reportMemberFilter, onChange: ev => setReportMemberFilter(ev.target.value),
              style: { background: C.surface, border: "1px solid " + C.border, borderRadius: 8, padding: "9px 12px", color: C.text, fontSize: 14, fontFamily: FONT, outline: "none" }
            },
              e("option", { value: "all" }, "Hamısı"),
              activeMembers(state.members).map(m => e("option", { key: m.id, value: m.id }, m.name))
            )
          )
        ),
        e("div", { style: { display: "flex", gap: 8, justifyContent: "flex-end" } },
          e("button", { onClick: exportExcel, style: btnStyle(C.green) }, "📊 Excel-ə ixrac et"),
          e("button", { onClick: () => window.print(), style: btnStyle(C.muted) }, "🖨 PDF (çap et / saxla)")
        )
      ),
      e("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 10 } },
        [
          ["Ümumi tapşırıq", total, C.text],
          ["Həll edildi", doneTasks.length, C.green],
          ["Həll edilmədi", failedTasks.length, C.red],
          ["Açıq / davam edir", openCount, C.amber],
          ["Orta həll vaxtı", formatDuration(avgMinutes * 60000), C.muted],
          ["Ümumi sərf olunan vaxt", formatDuration(totalMinutes * 60000), C.muted]
        ].map(([label, val, color]) => e("div", { key: label, style: { background: C.surface2, border: "1px solid " + C.border, borderRadius: 10, padding: "12px 14px" } },
          e("div", { style: { fontFamily: FONT, fontSize: 11.5, color: C.muted } }, label),
          e("div", { style: { fontFamily: DISPLAY_FONT, fontWeight: 800, fontSize: 20, color: color, marginTop: 3 } }, val)
        ))
      ),
      e("div", null,
        e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.text, fontWeight: 700, marginBottom: 10 } }, "Ən çox müraciət edən şöbələr"),
        deptList.length === 0
          ? e("div", { style: { color: C.faint, fontSize: 13, fontFamily: FONT } }, "Bu dövrdə məlumat yoxdur.")
          : e("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
              deptList.slice(0, 8).map(([name, count]) => BarRow(name, count, maxDeptCount, C.amber))
            )
      ),
      e("div", null,
        e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.text, fontWeight: 700, marginBottom: 10 } }, "Komanda performansı (həll edilən tapşırıqlar)"),
        memberList.length === 0
          ? e("div", { style: { color: C.faint, fontSize: 13, fontFamily: FONT } }, "Bu dövrdə həll edilmiş tapşırıq yoxdur.")
          : e("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
              memberList.map(([name, d]) => BarRow(name, d.count, maxMemberCount, C.green,
                d.count + " ədəd · " + formatDuration(d.minutes * 60000) + " ümumi"))
            )
      )
    ));
  }

  if (isReception && tab === "team") {
    sections.push(e("div", { key: "team", style: { display: "flex", flexDirection: "column", gap: 18 } },
      e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
        state.members.filter(m => m.role !== "reception").map((m, i) => editingMemberId === m.id
          ? e("div", { key: m.id, style: { display: "flex", flexDirection: "column", gap: 8, background: C.surface2, border: "1px solid " + C.amber, borderRadius: 9, padding: "10px 12px" } },
              e("div", { style: { display: "flex", gap: 8 } },
                e("div", { style: { flex: 2 } }, e(Input, { value: editMemberName, onChange: ev => setEditMemberName(ev.target.value), placeholder: "Ad" })),
                e("div", { style: { flex: 1 } }, e(Input, { value: editMemberPin, onChange: ev => setEditMemberPin(ev.target.value.replace(/\D/g, "").slice(0, 6)), placeholder: "PIN" }))
              ),
              e("div", { style: { display: "flex", gap: 8 } },
                e("button", { onClick: saveEditMember, disabled: !editMemberName.trim() || editMemberPin.length < 4,
                  style: { ...btnStyle(C.green), opacity: (!editMemberName.trim() || editMemberPin.length < 4) ? 0.5 : 1 } }, "✓ Yadda saxla"),
                e("button", { onClick: () => setEditingMemberId(null), style: btnStyle(C.muted) }, "✕ İmtina")
              )
            )
          : e("div", { key: m.id, style: { display: "flex", flexDirection: "column", gap: 8, background: C.surface2, border: "1px solid " + C.border, borderRadius: 9, padding: "9px 12px" } },
              e("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
                e("span", { style: { color: C.faint, fontFamily: FONT, fontSize: 12, width: 16 } }, i + 1),
                e(Avatar, { name: m.name, size: 26 }),
                e("span", { style: { flex: 1, fontFamily: FONT, fontSize: 13.5, color: C.text, fontWeight: 600 } }, m.name),
                e("button", { onClick: () => startEditMember(m), style: iconBtn }, "✎"),
                m.role === "member" && e("button", { onClick: () => moveMember(m.id, -1), style: iconBtn }, "▲"),
                m.role === "member" && e("button", { onClick: () => moveMember(m.id, 1), style: iconBtn }, "▼"),
                e("button", { onClick: () => removeMember(m.id), style: { ...iconBtn, color: C.red } }, "🗑")
              ),
              e("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
                [
                  { mode: "receiveOnly", label: "Yalnız qəbul edir", active: m.role === "member" && !m.canCreate },
                  { mode: "both", label: "Yaradır + qəbul edir", active: m.role === "member" && !!m.canCreate },
                  { mode: "createOnly", label: "Yalnız yaradır (dəstək tələbi)", active: m.role === "requester" }
                ].map(opt => e("button", {
                  key: opt.mode, onClick: () => setMemberMode(m.id, opt.mode),
                  style: { ...btnStyle(opt.active ? C.green : C.faint), fontSize: 11, background: opt.active ? C.greenDim : "transparent" }
                }, opt.label))
              )
            )
        )
      ),
      e("div", { style: { display: "flex", flexDirection: "column", gap: 10, background: C.surface, border: "1px solid " + C.border, borderRadius: 10, padding: 14 } },
        e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.muted, fontWeight: 600 } }, "Yeni üzv əlavə et"),
        e("div", { style: { display: "flex", gap: 10 } },
          e("div", { style: { flex: 2 } }, e(Input, { value: addMemberName, onChange: ev => setAddMemberName(ev.target.value), placeholder: "Ad" })),
          e("div", { style: { flex: 1 } }, e(Input, { value: addMemberPin, onChange: ev => setAddMemberPin(ev.target.value.replace(/\D/g, "").slice(0, 6)), placeholder: "PIN",
            onKeyDown: onEnter(addMember) }))
        ),
        e("button", { onClick: addMember, disabled: !addMemberName.trim() || addMemberPin.length < 4,
          style: { ...primaryBtn, opacity: (!addMemberName.trim() || addMemberPin.length < 4) ? 0.5 : 1 } }, "+ Əlavə et")
      )
    ));
  }

  if (isReception && tab === "settings") {
    sections.push(e("div", { key: "settings", style: { display: "flex", flexDirection: "column", gap: 12 } },
      e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.muted, fontWeight: 600 } }, "Yeni tapşırıq yaradanda standart olaraq seçili gələn üsul"),
      [{ id: "strict", label: "Avtomatik — sırf növbə ilə" }, { id: "skip", label: "Avtomatik — məşğul olanı keç" }, { id: "manual", label: "Özüm seçirəm" }]
        .map(opt => e("label", { key: opt.id, style: { display: "flex", alignItems: "center", gap: 9, fontFamily: FONT, fontSize: 13.5, color: C.text, cursor: "pointer" } },
          e("input", { type: "radio", checked: state.defaultMode === opt.id, onChange: () => persist(prev => ({ ...prev, defaultMode: opt.id })) }), opt.label)),
      e("div", { style: { color: C.faint, fontSize: 12.5, fontFamily: FONT, marginTop: 4 } },
        "Bu, yalnız \"Yeni tapşırıq\" formasının açılış dəyəridir — hər tapşırıqda üsulu dəyişə bilərsiniz."),
      e("div", { style: { height: 1, background: C.border, margin: "10px 0" } }),
      e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.text, fontWeight: 600 } }, "Şöbələr"),
      e("div", { style: { color: C.faint, fontSize: 12, fontFamily: FONT } }, "Tapşırıq yaradarkən seçilə bilən şöbə siyahısı — hesabatlarda qruplaşdırmaq üçün istifadə olunur."),
      e("div", { style: { display: "flex", flexWrap: "wrap", gap: 8 } },
        (state.departments || []).length === 0 && e("div", { style: { color: C.faint, fontSize: 12.5, fontFamily: FONT } }, "Hələ şöbə əlavə edilməyib."),
        (state.departments || []).map(d => e("span", {
          key: d, style: { display: "flex", alignItems: "center", gap: 6, background: C.surface2, border: "1px solid " + C.border, borderRadius: 7, padding: "5px 6px 5px 10px", fontSize: 12.5, fontFamily: FONT, color: C.text }
        }, d, e("button", { onClick: () => removeDepartment(d), style: { ...iconBtn, fontSize: 12, color: C.red } }, "✕")))
      ),
      e("div", { style: { display: "flex", gap: 8 } },
        e("input", {
          value: deptInput, onChange: ev => setDeptInput(ev.target.value), placeholder: "Yeni şöbə adı (məs. Mühasibatlıq)",
          onKeyDown: onEnter(addDepartment),
          style: { flex: 1, background: C.surface, border: "1px solid " + C.border, borderRadius: 8, padding: "9px 12px", color: C.text, fontSize: 14, fontFamily: FONT, outline: "none" }
        }),
        e("button", { onClick: addDepartment, style: btnStyle(C.amber) }, "+ Əlavə et")
      ),
      e("div", { style: { height: 1, background: C.border, margin: "10px 0" } }),
      e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.red, fontWeight: 600 } }, "Test datasının təmizlənməsi"),
      e("div", { style: { color: C.faint, fontSize: 12, fontFamily: FONT } }, "Ciddi istifadəyə keçməzdən əvvəl sınaq tapşırıqlarını/mesajlarını silin. Bu geri qaytarılmır."),
      e("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
        e("button", { onClick: resetAllTasks, style: btnStyle(C.red) }, "🗑 Bütün tapşırıqları sil"),
        e("button", { onClick: resetAllChat, style: btnStyle(C.red) }, "🗑 Bütün söhbəti sil")
      )
    ));
  }

  if (tab === "chat") {
    const others = state.members.filter(m => m.id !== currentUser.id);
    const thread = (state.chat || []).filter(m =>
      (m.senderId === currentUser.id && m.recipientId === chatPartnerId) ||
      (m.senderId === chatPartnerId && m.recipientId === currentUser.id)
    );
    const partner = others.find(m => m.id === chatPartnerId);
    sections.push(e("div", { key: "chat", style: { display: "flex", flexDirection: "column", gap: 12 } },
      e("div", { style: { fontFamily: FONT, fontSize: 12.5, color: C.muted, fontWeight: 600 } }, "Kiminlə yazmaq istəyirsiniz?"),
      e("div", { style: { display: "flex", flexWrap: "wrap", gap: 8 } },
        others.length === 0 && e("div", { style: { color: C.faint, fontSize: 13, fontFamily: FONT } }, "Başqa istifadəçi yoxdur."),
        others.map(m => {
          const unreadFromM = (state.chat || []).filter(msg => msg.senderId === m.id && msg.recipientId === currentUser.id && msg.at > (myReadReceipts[m.id] || 0)).length;
          return e("button", {
            key: m.id, onClick: () => setChatPartnerId(m.id),
            style: { display: "flex", alignItems: "center", gap: 7, padding: "6px 11px 6px 6px", borderRadius: 8,
              border: "1.5px solid " + (chatPartnerId === m.id ? C.amber : C.border),
              background: chatPartnerId === m.id ? C.amberDim : "transparent", cursor: "pointer" }
          },
            e(Avatar, { name: m.name, size: 22 }),
            e("span", { style: { fontFamily: FONT, fontSize: 13, color: C.text } }, m.name),
            unreadFromM > 0 && e("span", {
              style: { background: C.red, color: "#fff", fontSize: 10.5, fontWeight: 700, borderRadius: 999,
                minWidth: 16, height: 16, display: "inline-flex", alignItems: "center", justifyContent: "center", padding: "0 4px" }
            }, unreadFromM)
          );
        })
      ),
      chatPartnerId && e(React.Fragment, null,
        e("div", { style: { height: 1, background: C.border } }),
        e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.text, fontWeight: 700 } }, partner ? partner.name + " ilə söhbət" : ""),
        e("div", { style: { display: "flex", flexDirection: "column", gap: 8, maxHeight: 360, overflowY: "auto" } },
          thread.length === 0 && e("div", { style: { color: C.faint, fontSize: 13, fontFamily: FONT } }, "Hələ mesaj yoxdur."),
          thread.map(msg => e("div", {
            key: msg.id,
            style: { alignSelf: msg.senderId === currentUser.id ? "flex-end" : "flex-start",
              maxWidth: "80%", background: msg.senderId === currentUser.id ? C.amberDim : C.surface2,
              border: "1px solid " + C.border, borderRadius: 9, padding: "8px 12px" }
          },
            e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.text } }, msg.text),
            e("div", { style: { fontFamily: FONT, fontSize: 10.5, color: C.faint, marginTop: 3 } }, new Date(msg.at).toLocaleString("az-AZ"))
          ))
        ),
        e("div", { style: { display: "flex", gap: 8 } },
          e("input", {
            value: chatInput, onChange: ev => setChatInput(ev.target.value), placeholder: "Mesaj yaz...",
            onKeyDown: onEnter(sendChatMessage),
            style: { flex: 1, background: C.surface, border: "1px solid " + C.border, borderRadius: 8, padding: "9px 12px", color: C.text, fontSize: 14, fontFamily: FONT, outline: "none" }
          }),
          e("button", { onClick: sendChatMessage, style: primaryBtn }, "Göndər")
        )
      )
    ));
  }

  if (tab === "profile") {
    sections.push(e("div", { key: "profile", style: { display: "flex", flexDirection: "column", gap: 14, maxWidth: 320 } },
      e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.muted, fontWeight: 600 } }, "Adınızı və ya PIN-inizi dəyişin"),
      e(Input, { label: "Ad", value: profileName, onChange: ev => setProfileName(ev.target.value) }),
      e(Input, { label: "PIN", value: profilePin, onChange: ev => setProfilePin(ev.target.value.replace(/\D/g, "").slice(0, 6)), placeholder: "0000",
        onKeyDown: onEnter(saveProfile) }),
      e("button", { onClick: saveProfile, disabled: !profileName.trim() || profilePin.length < 4,
        style: { ...primaryBtn, opacity: (!profileName.trim() || profilePin.length < 4) ? 0.5 : 1 } }, "✓ Yadda saxla"),
      profileSaved && e("div", { style: { color: C.green, fontSize: 12.5, fontFamily: FONT, fontWeight: 600 } }, "Yadda saxlanıldı."),
      e("div", { style: { height: 1, background: C.border, margin: "8px 0" } }),
      e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.muted, fontWeight: 600 } }, "Bildirişlər"),
      notifPermission === "granted" && e("div", { style: { color: C.green, fontSize: 13, fontFamily: FONT } }, "✓ Bildirişlər aktivdir."),
      notifPermission === "granted" && e("button", { onClick: enablePush, style: btnStyle(C.amber) }, "🔄 Token-i yenilə / diaqnostika"),
      notifPermission === "denied" && e("div", { style: { color: C.red, fontSize: 13, fontFamily: FONT } }, "Bildirişlər bloklanıb — brauzerin sayt ayarlarından əl ilə icazə verməlisiniz."),
      notifPermission === "unsupported" && e("div", { style: { color: C.faint, fontSize: 13, fontFamily: FONT } }, "Bu brauzer bildirişi dəstəkləmir."),
      notifPermission === "default" && e("button", {
        onClick: enablePush,
        style: primaryBtn
      }, "🔔 Bildirişləri aktivləşdir"),
      pushDebug && e("div", { style: { color: C.muted, fontSize: 11.5, fontFamily: "monospace", wordBreak: "break-all", background: C.surface2, padding: 8, borderRadius: 6 } }, pushDebug)
    ));

    if (!isReception && !isRequesterOnly) {
      const myRangeStartMs = new Date(reportStart + "T00:00:00").getTime();
      const myRangeEndMs = new Date(reportEnd + "T23:59:59").getTime();
      const myTasksAll = state.tasks.filter(t => t.assignedTo === currentUser.id);
      const myFiltered = myTasksAll.filter(t => t.createdAt >= myRangeStartMs && t.createdAt <= myRangeEndMs);
      const myDone = myFiltered.filter(t => t.status === STATUS.DONE);
      const myFailed = myFiltered.filter(t => t.status === STATUS.FAILED);
      const myOpen = myFiltered.length - myDone.length - myFailed.length;
      const myTotalMin = myDone.reduce((s, t) => s + (t.durationMinutes || 0), 0);
      const myAvgMin = myDone.length ? Math.round(myTotalMin / myDone.length) : 0;
      const myRecent = [...myDone, ...myFailed].sort((a, b) => (b.resolvedAt || b.failedAt || 0) - (a.resolvedAt || a.failedAt || 0)).slice(0, 8);

      sections.push(e("div", { key: "myreport", style: { display: "flex", flexDirection: "column", gap: 14 } },
        e("div", { style: { height: 1, background: C.border } }),
        e("div", { style: { fontFamily: FONT, fontSize: 13, color: C.text, fontWeight: 700 } }, "Mənim hesabatım"),
        e("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
          e(Input, { label: "Başlanğıc tarix", type: "date", value: reportStart, onChange: ev => setReportStart(ev.target.value) }),
          e(Input, { label: "Son tarix", type: "date", value: reportEnd, onChange: ev => setReportEnd(ev.target.value) })
        ),
        e("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 10 } },
          [
            ["Mənə düşən", myFiltered.length, C.text],
            ["Həll etdiyim", myDone.length, C.green],
            ["Həll edə bilmədiyim", myFailed.length, C.red],
            ["Davam edən", myOpen, C.amber],
            ["Orta vaxtım", formatDuration(myAvgMin * 60000), C.muted],
            ["Ümumi sərf etdiyim vaxt", formatDuration(myTotalMin * 60000), C.muted]
          ].map(([label, val, color]) => e("div", { key: label, style: { background: C.surface2, border: "1px solid " + C.border, borderRadius: 10, padding: "10px 12px" } },
            e("div", { style: { fontFamily: FONT, fontSize: 11, color: C.muted } }, label),
            e("div", { style: { fontFamily: DISPLAY_FONT, fontWeight: 800, fontSize: 18, color: color, marginTop: 3 } }, val)
          ))
        ),
        myRecent.length > 0 && e("div", null,
          e("div", { style: { fontFamily: FONT, fontSize: 12.5, color: C.muted, fontWeight: 600, marginBottom: 8 } }, "Bu dövrdə nəticələndirdiklərim"),
          e("div", { style: { display: "flex", flexDirection: "column", gap: 6 } },
            myRecent.map(t => e("div", { key: t.id, style: { display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12.5, fontFamily: FONT, background: C.surface2, borderRadius: 7, padding: "7px 10px" } },
              e("span", { style: { color: C.text } }, t.title),
              e(Badge, { tone: t.status === STATUS.DONE ? "green" : "red" }, t.status)
            ))
          )
        )
      ));
    }
  }

  return e("div", { style: wrapStyle },
    e("div", { style: { maxWidth: 780, margin: "0 auto", width: "100%", display: "flex", flexDirection: "column", gap: 22, padding: "28px 20px 60px" } }, sections)
  );
}

const wrapStyle = { minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(e(App));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("firebase-messaging-sw.js").catch(() => {});
  });
}

</script>
</body>
</html>
